<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070707" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="metalChassis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="40%" stop-color="#242424" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGrad2)" />
  <ellipse cx="400" cy="880" rx="200" ry="18" fill="#000000" opacity="0.9" />

  <!-- Side Profile Monolith -->
  <rect x="290" y="150" width="220" height="690" rx="3" fill="url(#metalChassis)" stroke="#2B2B2B" stroke-width="1.5" />

  <!-- Rear Heat Sink Extrusion Fins -->
  <g stroke="#1F1F1F" stroke-width="2">
    <line x1="286" y1="200" x2="286" y2="800" />
    <line x1="282" y1="220" x2="282" y2="780" />
    <line x1="278" y1="250" x2="278" y2="750" />
  </g>

  <!-- Front Glass Facet Line -->
  <rect x="500" y="160" width="8" height="670" fill="#2A2A2A" stroke="#3D3D3D" stroke-width="0.5" />
  <line x1="508" y1="160" x2="508" y2="830" stroke="#E11D48" stroke-width="1.5" />

  <!-- Hidden Cable Raceway & Flush Power Port -->
  <rect x="330" y="800" width="40" height="15" rx="2" fill="#090909" stroke="#333333" stroke-width="1" />
  <circle cx="350" cy="807.5" r="3.5" fill="#E11D48" />

  <!-- Technical Dimension Callouts -->
  <g stroke="#666666" stroke-width="1" stroke-dasharray="3,3" opacity="0.6">
    <line x1="240" y1="150" x2="290" y2="150" />
    <line x1="240" y1="840" x2="290" y2="840" />
    <line x1="250" y1="150" x2="250" y2="840" stroke-dasharray="none" />
  </g>
  <text x="235" y="500" font-family="'Space Grotesk', monospace" font-size="11" fill="#E11D48" text-anchor="middle" transform="rotate(-90 235 500)">DEPTH 380 MM // ANODIZED PROFILE</text>

  <text x="400" y="930" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">HEAT 2.0 // LATERAL ELEVATION</text>
  <text x="400" y="955" font-family="'Inter', sans-serif" font-size="11" fill="#7E7E86" letter-spacing="2" text-anchor="middle">AEROSPACE 6063 EXTRUSION CHASSIS</text>
</svg>
