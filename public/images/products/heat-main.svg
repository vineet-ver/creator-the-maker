<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="heatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090909" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="anodizedMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="50%" stop-color="#161616" />
      <stop offset="100%" stop-color="#282828" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#heatBg)" />
  <ellipse cx="400" cy="860" rx="220" ry="20" fill="#000000" opacity="0.9" />

  <!-- Single Column Monolith Chassis -->
  <rect x="250" y="160" width="300" height="660" fill="url(#anodizedMetal)" stroke="#383838" stroke-width="1.5" />
  
  <!-- Four Internal Compartments -->
  <g stroke="#1F1F1F" stroke-width="1">
    <rect x="268" y="180" width="264" height="140" fill="#0B0B0B" />
    <rect x="268" y="335" width="264" height="140" fill="#0B0B0B" />
    <rect x="268" y="490" width="264" height="140" fill="#0B0B0B" />
    <rect x="268" y="645" width="264" height="140" fill="#0B0B0B" />
  </g>

  <!-- Linear Glow on Shelves -->
  <line x1="280" y1="188" x2="520" y2="188" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
  <line x1="280" y1="343" x2="520" y2="343" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
  <line x1="280" y1="498" x2="520" y2="498" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
  <line x1="280" y1="653" x2="520" y2="653" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />

  <!-- Sneaker Silhouettes across shelves -->
  <path d="M 330,285 Q 360,290 400,288 Q 450,285 470,270 L 460,250 Q 430,240 400,230 L 370,235 Z" fill="#181818" stroke="#555555" />
  <path d="M 330,440 Q 360,445 400,443 Q 450,440 470,425 L 460,405 Q 430,395 400,385 L 370,390 Z" fill="#181818" stroke="#555555" />
  <path d="M 330,595 Q 360,600 400,598 Q 450,595 470,580 L 460,560 Q 430,550 400,540 L 370,545 Z" fill="#181818" stroke="#555555" />
  <path d="M 330,750 Q 360,755 400,753 Q 450,750 470,735 L 460,715 Q 430,705 400,695 L 370,700 Z" fill="#181818" stroke="#555555" />

  <!-- Single Full-Height Glass Facade with Soft Sheen -->
  <rect x="256" y="168" width="288" height="644" fill="#FFFFFF" fill-opacity="0.04" stroke="#444444" stroke-width="0.75" />
  <polygon points="265,175 420,175 265,650" fill="#FFFFFF" opacity="0.03" />

  <!-- Precision Red Accent Indicator -->
  <rect x="545" y="470" width="3" height="40" fill="#E11D48" />

  <text x="400" y="915" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">HEAT // SINGLE MONOLITH</text>
  <text x="400" y="940" font-family="'Inter', sans-serif" font-size="11" fill="#7E7E86" letter-spacing="2" text-anchor="middle">FOUR TIER ARCHITECTURAL SHOWCASE</text>
</svg>
