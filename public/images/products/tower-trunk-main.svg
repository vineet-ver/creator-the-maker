<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="towerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="towerChassis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="50%" stop-color="#282828" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#towerBg)" />
  <ellipse cx="400" cy="900" rx="200" ry="18" fill="#000000" opacity="0.95" />

  <!-- Soaring 2.2M Vertical Frame -->
  <rect x="260" y="100" width="280" height="780" fill="url(#towerChassis)" stroke="#383838" stroke-width="2" />

  <!-- 8 Tier Display Matrix -->
  <!-- Left column and Right column cells -->
  <g fill="#0B0B0B" stroke="#222222" stroke-width="1">
    <!-- Row 1 -->
    <rect x="274" y="116" width="120" height="85" />
    <rect x="406" y="116" width="120" height="85" />
    <!-- Row 2 -->
    <rect x="274" y="210" width="120" height="85" />
    <rect x="406" y="210" width="120" height="85" />
    <!-- Row 3 -->
    <rect x="274" y="304" width="120" height="85" />
    <rect x="406" y="304" width="120" height="85" />
    <!-- Row 4 -->
    <rect x="274" y="398" width="120" height="85" />
    <rect x="406" y="398" width="120" height="85" />
    <!-- Row 5 -->
    <rect x="274" y="492" width="120" height="85" />
    <rect x="406" y="492" width="120" height="85" />
    <!-- Row 6 -->
    <rect x="274" y="586" width="120" height="85" />
    <rect x="406" y="586" width="120" height="85" />
    <!-- Row 7 -->
    <rect x="274" y="680" width="120" height="85" />
    <rect x="406" y="680" width="120" height="85" />
    <!-- Row 8 -->
    <rect x="274" y="774" width="120" height="85" />
    <rect x="406" y="774" width="120" height="85" />
  </g>

  <!-- Clean Precision LED Lines in each cell -->
  <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.85">
    <line x1="280" y1="122" x2="388" y2="122" />
    <line x1="412" y1="122" x2="520" y2="122" />
    <line x1="280" y1="216" x2="388" y2="216" />
    <line x1="412" y1="216" x2="520" y2="216" />
    <line x1="280" y1="310" x2="388" y2="310" />
    <line x1="412" y1="310" x2="520" y2="310" />
    <line x1="280" y1="404" x2="388" y2="404" />
    <line x1="412" y1="404" x2="520" y2="404" />
    <line x1="280" y1="498" x2="388" y2="498" />
    <line x1="412" y1="498" x2="520" y2="498" />
    <line x1="280" y1="592" x2="388" y2="592" />
    <line x1="412" y1="592" x2="520" y2="592" />
    <line x1="280" y1="686" x2="388" y2="686" />
    <line x1="412" y1="686" x2="520" y2="686" />
    <line x1="280" y1="780" x2="388" y2="780" />
    <line x1="412" y1="780" x2="520" y2="780" />
  </g>

  <!-- Red Accent Vertical Spine Track -->
  <line x1="400" y1="100" x2="400" y2="880" stroke="#E11D48" stroke-width="2" />

  <!-- Subtle Glass Facade Glare -->
  <polygon points="265,105 380,105 265,750" fill="#FFFFFF" opacity="0.04" />

  <text x="400" y="935" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">THE TOWER TRUNK</text>
  <text x="400" y="960" font-family="'Inter', sans-serif" font-size="11" fill="#7E7E86" letter-spacing="2" text-anchor="middle">2.2M VERTICAL MONOLITH // 24 PAIR INTEGRATION</text>
</svg>
