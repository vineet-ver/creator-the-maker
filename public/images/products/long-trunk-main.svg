<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="credenzaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="leatherTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1C" />
      <stop offset="50%" stop-color="#242424" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="smokedGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2A2A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#181818" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#credenzaBg)" />
  <ellipse cx="500" cy="510" rx="420" ry="24" fill="#000000" opacity="0.9" />

  <!-- Credenza Plinth Feet -->
  <rect x="140" y="470" width="30" height="25" fill="#222222" stroke="#444444" />
  <rect x="830" y="470" width="30" height="25" fill="#222222" stroke="#444444" />
  <rect x="485" y="470" width="30" height="25" fill="#222222" stroke="#444444" />

  <!-- Main Horizontal Credenza Body -->
  <rect x="100" y="240" width="800" height="230" rx="2" fill="#141414" stroke="#333333" stroke-width="1.5" />

  <!-- Smoked Glass Top Presentation Surface -->
  <rect x="96" y="226" width="808" height="18" fill="url(#smokedGlass)" stroke="#444444" stroke-width="1" />
  <line x1="100" y1="230" x2="900" y2="230" stroke="#E11D48" stroke-width="2" />

  <!-- Five Horizontal Display Compartments with Warm Horizon LED Glow -->
  <g fill="#0A0A0A" stroke="#222222" stroke-width="1">
    <rect x="120" y="260" width="140" height="190" />
    <rect x="275" y="260" width="140" height="190" />
    <rect x="430" y="260" width="140" height="190" />
    <rect x="585" y="260" width="140" height="190" />
    <rect x="740" y="260" width="140" height="190" />
  </g>

  <!-- Horizon Glow Bottom Bars -->
  <g stroke="#FFAE52" stroke-width="2.5" opacity="0.8">
    <line x1="130" y1="440" x2="250" y2="440" />
    <line x1="285" y1="440" x2="405" y2="440" />
    <line x1="440" y1="440" x2="560" y2="440" />
    <line x1="595" y1="440" x2="715" y2="440" />
    <line x1="750" y1="440" x2="870" y2="440" />
  </g>

  <!-- Sneaker Silhouettes Resting in Compartments -->
  <g stroke="#555555" stroke-width="1" fill="#181818">
    <path d="M 140,430 Q 180,435 210,425 L 240,410 L 230,390 L 190,380 Z" />
    <path d="M 295,430 Q 335,435 365,425 L 395,410 L 385,390 L 345,380 Z" />
    <path d="M 450,430 Q 490,435 520,425 L 550,410 L 540,390 L 500,380 Z" />
    <path d="M 605,430 Q 645,435 675,425 L 705,410 L 695,390 L 655,380 Z" />
    <path d="M 760,430 Q 800,435 830,425 L 860,410 L 850,390 L 810,380 Z" />
  </g>

  <!-- Typography -->
  <text x="500" y="140" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#E11D48" letter-spacing="4" text-anchor="middle">HORIZON PLINTH ARCHITECTURE</text>
  <text x="500" y="170" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">THE LONG TRUNK</text>
  <text x="500" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#7E7E86" letter-spacing="2" text-anchor="middle">LOW PROFILE HORIZONTAL VAULT // 250KG RATED INTEGRATED BENCH</text>
</svg>
