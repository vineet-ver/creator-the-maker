<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="concreteWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="50%" stop-color="#161616" />
      <stop offset="100%" stop-color="#0D0D0D" />
    </linearGradient>
    <linearGradient id="coveLighting" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF1DF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#concreteWall)" />

  <!-- Ceiling Cove Light Wash -->
  <rect x="0" y="0" width="800" height="300" fill="url(#coveLighting)" />
  <line x1="0" y1="2" x2="800" y2="2" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />

  <!-- Hardwood Architectural Floor Boards -->
  <polygon points="0,750 800,750 800,1000 0,1000" fill="#0A0A0A" />
  <line x1="0" y1="750" x2="800" y2="750" stroke="#222222" stroke-width="1.5" />
  <line x1="200" y1="750" x2="100" y2="1000" stroke="#181818" stroke-width="1" />
  <line x1="450" y1="750" x2="400" y2="1000" stroke="#181818" stroke-width="1" />
  <line x1="680" y1="750" x2="720" y2="1000" stroke="#181818" stroke-width="1" />

  <!-- Floor Cast Shadow -->
  <ellipse cx="400" cy="765" rx="220" ry="20" fill="#000000" opacity="0.9" />

  <!-- Architectural Plinth & Two Adjacent HEAT 2.0 Units -->
  <!-- Left Unit -->
  <rect x="220" y="320" width="160" height="430" fill="#141414" stroke="#2C2C2C" stroke-width="1.5" />
  <rect x="230" y="335" width="140" height="190" fill="#0B0B0B" stroke="#1C1C1C" />
  <rect x="230" y="540" width="140" height="195" fill="#0B0B0B" stroke="#1C1C1C" />
  <line x1="240" y1="345" x2="360" y2="345" stroke="#FFF7ED" stroke-width="3" />
  <line x1="240" y1="550" x2="360" y2="550" stroke="#FFF7ED" stroke-width="3" />

  <!-- Right Unit -->
  <rect x="410" y="320" width="160" height="430" fill="#141414" stroke="#2C2C2C" stroke-width="1.5" />
  <rect x="420" y="335" width="140" height="190" fill="#0B0B0B" stroke="#1C1C1C" />
  <rect x="420" y="540" width="140" height="195" fill="#0B0B0B" stroke="#1C1C1C" />
  <line x1="430" y1="345" x2="550" y2="345" stroke="#FFF7ED" stroke-width="3" />
  <line x1="430" y1="550" x2="550" y2="550" stroke="#FFF7ED" stroke-width="3" />

  <!-- Red Accent Baseline Trim -->
  <line x1="220" y1="750" x2="570" y2="750" stroke="#E11D48" stroke-width="2" />

  <!-- Ambient Light Reflection on Glass Doors -->
  <polygon points="225,325 310,325 240,740 225,740" fill="#FFFFFF" opacity="0.04" />
  <polygon points="415,325 500,325 430,740 415,740" fill="#FFFFFF" opacity="0.04" />

  <text x="400" y="870" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">RESIDENTIAL INSTALLATION</text>
  <text x="400" y="900" font-family="'Inter', sans-serif" font-size="12" fill="#7E7E86" letter-spacing="2" text-anchor="middle">DUAL MODULE ARRAY // WARM LIGHTING CALIBRATION</text>
</svg>
