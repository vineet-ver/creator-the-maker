<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="detailBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="metalSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3A" />
      <stop offset="50%" stop-color="#212121" />
      <stop offset="100%" stop-color="#181818" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#detailBg)" />

  <!-- Macro CNC Milled Hinge & Corner Assembly -->
  <g transform="translate(150, 150)">
    <!-- Main Chamfered Block -->
    <polygon points="100,50 420,50 450,90 450,450 400,500 50,500 50,100" fill="url(#metalSurface)" stroke="#4A4A4A" stroke-width="2" />
    
    <!-- CNC Tool Paths Simulation -->
    <path d="M 120,80 L 390,80" stroke="#555555" stroke-width="0.75" />
    <path d="M 120,95 L 410,95" stroke="#555555" stroke-width="0.75" />
    <path d="M 120,110 L 410,110" stroke="#555555" stroke-width="0.75" />

    <!-- Hex Fasteners -->
    <circle cx="150" cy="180" r="16" fill="#151515" stroke="#666666" stroke-width="2" />
    <polygon points="150,172 157,176 157,184 150,188 143,184 143,176" fill="#2E2E2E" />

    <circle cx="150" cy="380" r="16" fill="#151515" stroke="#666666" stroke-width="2" />
    <polygon points="150,372 157,376 157,384 150,388 143,384 143,376" fill="#2E2E2E" />

    <!-- Kinetic Pivot Cylinder -->
    <rect x="260" y="140" width="130" height="280" rx="10" fill="#1C1C1C" stroke="#E11D48" stroke-width="1.5" />
    <line x1="260" y1="280" x2="390" y2="280" stroke="#E11D48" stroke-width="1" />
    
    <!-- Laser Etched Serial Badge -->
    <rect x="280" y="320" width="90" height="40" fill="#0A0A0A" stroke="#333333" stroke-width="1" />
    <text x="325" y="338" font-family="'Space Grotesk', monospace" font-size="8" fill="#E11D48" text-anchor="middle">CTM.ARCH.6063</text>
    <text x="325" y="350" font-family="'Space Grotesk', monospace" font-size="8" fill="#888888" text-anchor="middle">TOLERANCE ±0.02MM</text>

    <!-- Red Silicone Compression Gasket -->
    <rect x="440" y="90" width="10" height="360" fill="#E11D48" opacity="0.9" />
  </g>

  <text x="400" y="860" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#E11D48" letter-spacing="4" text-anchor="middle">DETAIL 03 // CONCEALED 110° HINGE</text>
  <text x="400" y="890" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">PRECISION TOLERANCE ±0.02MM</text>
  <text x="400" y="920" font-family="'Inter', sans-serif" font-size="12" fill="#7E7E86" letter-spacing="2" text-anchor="middle">CUSTOM CAST BALLISTIC SILICONE SEAL</text>
</svg>
