<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070707" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
  </defs>
  <rect width="900" height="650" fill="url(#g1)" />
  <!-- Tribeca Loft Brick & Concrete Ambience -->
  <line x1="100" y1="0" x2="100" y2="650" stroke="#1A1A1A" stroke-width="1.5" />
  <line x1="800" y1="0" x2="800" y2="650" stroke="#1A1A1A" stroke-width="1.5" />
  <!-- Massive Floor to ceiling illuminated display wall -->
  <g fill="#101010" stroke="#2D2D2D" stroke-width="1.5">
    <rect x="150" y="80" width="180" height="480" />
    <rect x="360" y="80" width="180" height="480" />
    <rect x="570" y="80" width="180" height="480" />
  </g>
  <!-- Shelf LED lines -->
  <g stroke="#FFFFFF" stroke-width="2" opacity="0.8">
    <line x1="160" y1="180" x2="320" y2="180" />
    <line x1="160" y1="280" x2="320" y2="280" />
    <line x1="160" y1="380" x2="320" y2="380" />
    <line x1="160" y1="480" x2="320" y2="480" />
    <line x1="370" y1="180" x2="530" y2="180" />
    <line x1="370" y1="280" x2="530" y2="280" />
    <line x1="370" y1="380" x2="530" y2="380" />
    <line x1="370" y1="480" x2="530" y2="480" />
    <line x1="580" y1="180" x2="740" y2="180" />
    <line x1="580" y1="280" x2="740" y2="280" />
    <line x1="580" y1="380" x2="740" y2="380" />
    <line x1="580" y1="480" x2="740" y2="480" />
  </g>
  <!-- Crimson accent tags -->
  <rect x="150" y="80" width="180" height="3" fill="#E11D48" />
  <rect x="360" y="80" width="180" height="3" fill="#E11D48" />
  <rect x="570" y="80" width="180" height="3" fill="#E11D48" />
  <text x="450" y="605" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="3" text-anchor="middle">THE TRIBECA VAULT // NEW YORK</text>
</svg>
